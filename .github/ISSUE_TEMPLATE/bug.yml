name: Bug report
description: 再現可能な不具合や回帰を報告する。
labels:
  - "10: type/bug"
  - "00: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        秘密情報、token、個人情報、private なログは public issue に含めないでください。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が壊れているかを短く書いてください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 確認できている最小の再現手順を書いてください。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
      description: 本来どう動くべきかを書いてください。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に起きたことを書いてください。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: OS、runtime、browser、package version、commit SHA など。
      placeholder: |
        - OS:
        - Runtime:
        - Version or commit:
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 関連リンク、secret を除去したログ、スクリーンショット、推定原因など。
    validations:
      required: false
