name: Feature request
description: 新機能や既存機能の拡張を提案する。
labels:
  - "10: type/feature"
  - "00: needs-triage"
body:
  - type: textarea
    id: problem
    attributes:
      label: 解きたい問題
      description: 何に困っていて、誰にとって価値があるかを書いてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 最小限で役に立つ解決案を書いてください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した別案や、採用しない理由があれば書いてください。
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 完了と判断できる観測可能な条件を書いてください。
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: breaking
    attributes:
      label: 破壊的変更の可能性
      options:
        - なし
        - あり
        - 不明
    validations:
      required: true
