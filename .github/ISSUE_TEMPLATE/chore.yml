name: 保守・設定変更
description: 保守、設定、docs、CIなどの作業を起票する
labels:
  - "type: chore"
body:
  - type: textarea
    id: task
    attributes:
      label: 作業内容
      description: 何を変更するかを書いてください。
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 背景
      description: なぜこの作業が必要かを書いてください。
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: 観測可能な完了条件を書いてください。
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 対象外、制約、関連Issueなど。
    validations:
      required: false
