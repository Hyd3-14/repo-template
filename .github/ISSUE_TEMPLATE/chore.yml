name: Chore
description: Track maintenance, documentation, or repository operations work.
title: "chore: "
labels:
  - chore
  - needs-triage
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What risk, cost, or follow-up does this address?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and explicitly out of scope?
      placeholder: |
        Included:
        Excluded:
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Concrete completion criteria.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
