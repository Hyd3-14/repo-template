name: GitHub Actions Static Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          # The pinned official actionlint v1.7.12 image includes ShellCheck.
          docker run --rm \
            -v "$PWD":/repo \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color \
            -shellcheck /usr/local/bin/shellcheck

  zizmor:
    name: zizmor
    needs: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          collect: all
          token: ${{ github.token }}
          version: v1.29.0

  ghalint:
    name: ghalint
    needs: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download and verify ghalint
        shell: bash
        env:
          GHALINT_VERSION: 1.5.6
          GHALINT_SHA256: 98ee0e3330de7286f470d1e89c03ff7ce70d7a5998ba0f15969c400447be579c
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghalint.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/suzuki-shunsuke/ghalint/releases/download/v${GHALINT_VERSION}/ghalint_${GHALINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GHALINT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/ghalint" version
          "$RUNNER_TEMP/ghalint" run

  pinact:
    name: pinact
    needs: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download and verify pinact
        shell: bash
        env:
          PINACT_VERSION: 4.1.1
          PINACT_SHA256: d1cffebe5704b74e2e5f8a864efb9f7e54768972dc686188c008033fb1797841
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pinact.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          printf '%s  %s\n' "$PINACT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/pinact" --version
      - name: Check pinned actions and version annotations
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pinact" run --check --verify-comment

  static-checks:
    name: GitHub Actions Static Checks
    if: ${{ always() }}
    needs:
      - actionlint
      - zizmor
      - ghalint
      - pinact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a static check did not pass
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        shell: bash
        run: |
          echo "One or more GitHub Actions static checks failed or were skipped."
          exit 1
