name: GitHub Actions Static Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  jactionlint:
    name: jactionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.6
          install: true
          cache: true
      # 構文・型（旧actionlint）と権限・timeoutなどのポリシー（旧ghalint）を.github/jactionlint.yamlで検査する。
      - name: Run jactionlint
        shell: bash
        run: |
          set -euo pipefail
          jactionlint --shellcheck "$(command -v shellcheck)" --pyflakes '' --format github

  zizmor:
    name: zizmor
    needs: jactionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          collect: all
          token: ${{ github.token }}
          version: v1.29.0

  pinact:
    name: pinact
    needs: jactionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify pinact
        shell: bash
        env:
          PINACT_VERSION: 4.1.1
          PINACT_SHA256: d1cffebe5704b74e2e5f8a864efb9f7e54768972dc686188c008033fb1797841
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pinact.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          printf '%s  %s\n' "$PINACT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/pinact" --version
      - name: Check pinned actions and version annotations
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pinact" run --check --verify-comment

  static-checks:
    name: GitHub Actions Static Checks
    if: ${{ always() }}
    needs:
      - jactionlint
      - zizmor
      - pinact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a static check did not pass
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        shell: bash
        run: |
          echo "One or more GitHub Actions static checks failed or were skipped."
          exit 1
