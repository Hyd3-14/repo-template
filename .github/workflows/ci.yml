name: Baseline CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  # 重い検証jobを追加する場合は、`needs: changes`と
  # `if: needs.changes.outputs.run_heavy == 'true'`で文書だけの変更時に省略する。
  # 省略したjobはskippedとなり、required checkを満たす。判定基準はscripts/ci-changesを参照する。
  changes:
    name: Determine required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_heavy: ${{ steps.changes.outputs.run_heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine heavy checks
        id: changes
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: ./scripts/ci-changes

  static-checks:
    name: Baseline static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.6
          install: true
          cache: true

      - name: Run script tests
        shell: bash
        run: python3 -m unittest discover -s scripts/tests

      - name: Check generated docs TOC
        shell: bash
        run: ./scripts/docs-toc --check

      - name: Run baseline validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: mise run validate
