name: Baseline CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Baseline static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22 # v4.2.2
        with:
          persist-credentials: false

      - name: Check repository baseline files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "AGENTS.md"
            "README.md"
            "SECURITY.md"
            ".github/dependabot.yml"
            ".github/labels.yml"
            ".github/pull_request_template.md"
            ".github/workflows/ci.yml"
            ".github/workflows/dependency-review.yml"
            "docs/operations/manual-tasks.md"
            "docs/operations/repo-baseline.md"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required baseline file is missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check for obvious secret filenames
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(auth|oauth|token|credential|credentials|secret|secrets|session|sessions|hosts)\.(json|ya?ml|toml|ini|env|txt)$|(^|/)\.env($|\.)'
          matches=$(find . -path ./.git -prune -o -type f -print | sed 's#^\./##' | grep -Ei "$forbidden" || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Potential secret or local state file names found"
            exit 1
          fi

      - name: Check workflow permissions are explicit
        shell: bash
        run: |
          set -euo pipefail
          missing=$(find .github/workflows -name '*.yml' -type f -print0 |
            xargs -0 awk '
              FNR == 1 { has = 0 }
              /^permissions:/ { has = 1 }
              ENDFILE { if (!has) print FILENAME }
            ')
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "::error::Workflow files must declare permissions explicitly"
            exit 1
          fi
