name: Dependabot Automerge

on:
  workflow_run:
    workflows:
      - Baseline CI
      - Dependency Review
    types:
      - completed
  pull_request_target:
    types:
      - labeled
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  automerge:
    name: Guarded automerge
    if: >
      github.event_name == 'pull_request_target' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check Dependabot PR metadata
        id: metadata
        uses: dependabot/fetch-metadata@08eff52bf64351f401fb50d4972fa95b9f2c2d1b # v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm required checks passed
        id: checks
        if: >
          github.actor == 'dependabot[bot]' &&
          contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          required='["Baseline static checks","Dependency Review"]'
          check_runs=$(gh api "/repos/$REPO/commits/$SHA/check-runs" --jq '.check_runs')
          missing=$(jq -r --argjson required "$required" '
            $required[]
            as $name
            | select(
                [ .[] | select(.name == $name and .status == "completed" and .conclusion == "success") ]
                | length == 0
              )
          ' <<< "$check_runs")
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for minor and patch updates
        if: >
          github.actor == 'dependabot[bot]' &&
          contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type) &&
          steps.checks.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch

  automerge-after-checks:
    name: Re-check after required workflows
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Find pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          prs=$(gh api "/repos/$REPO/commits/$SHA/pulls" \
            --header "Accept: application/vnd.github+json" \
            --jq 'map(select(.user.login == "dependabot[bot]")) | .[0]')
          if [ "$prs" = "null" ] || [ -z "$prs" ]; then
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "has_pr=true"
            echo "url=$(jq -r '.html_url' <<< "$prs")"
            echo "number=$(jq -r '.number' <<< "$prs")"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch Dependabot metadata
        id: metadata
        if: steps.pr.outputs.has_pr == 'true' && github.event.workflow_run.conclusion == 'success'
        uses: dependabot/fetch-metadata@08eff52bf64351f401fb50d4972fa95b9f2c2d1b # v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm PR is eligible
        id: eligible
        if: >
          steps.pr.outputs.has_pr == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          labels=$(gh api "/repos/$REPO/issues/$PR_NUMBER/labels" --jq 'map(.name)')
          has_blocked=$(jq -r 'contains(["status: blocked"])' <<< "$labels")
          if [ "$has_blocked" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          required='["Baseline static checks","Dependency Review"]'
          check_runs=$(gh api "/repos/$REPO/commits/$SHA/check-runs" --jq '.check_runs')
          missing=$(jq -r --argjson required "$required" '
            $required[]
            as $name
            | select(
                [ .[] | select(.name == $name and .status == "completed" and .conclusion == "success") ]
                | length == 0
              )
          ' <<< "$check_runs")
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge when checks are green
        if: steps.eligible.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch
