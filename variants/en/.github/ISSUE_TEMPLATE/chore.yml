name: Maintenance change
description: Track maintenance, configuration, documentation, or CI work
title: ""
labels:
  - "type: chore"
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be changed?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Background
      description: Why is this work needed?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: List observable completion criteria.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
