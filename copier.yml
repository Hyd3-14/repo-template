# Copier template configuration for the Hyd3 repository baseline.
# Generate:  copier copy gh:Hyd3-14/repo-template <dest>
# Update:    copier update (inside a generated repository)

_min_copier_version: "9.0.0"

project_name:
  type: str
  help: "Repository name (used in the generated README)"
  default: "my-repo"

project_description:
  type: str
  help: "One-line description of the repository"
  default: ""

# Files a generated repository is expected to rewrite for itself.
# They are created on the first copy and never overwritten by updates.
_skip_if_exists:
  - "AGENTS.md"
  - ".github/workflows/ci.yml"

# NOTE: setting _exclude replaces Copier's default exclusion list,
# so the defaults are repeated here explicitly. Without them, .git and
# copier.yml itself leak into generated repositories.
# The template repository's own README lives in .github/README.md and
# is not part of the baseline; generated repositories receive the
# rendered README.md.jinja instead.
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - ".github/README.md"
  - ".github/README.ja.md"
  - "docs/getting-started.md"
  - "docs/getting-started.ja.md"
